  <style>
:root {
  --ink: #0a0a0b;

  --muted: #a3a3a8;
  --acid: #d4ff00;
  --blue: #667cff;
  --coral: #ff6b59;
}

html { scroll-behavior: smooth; }
body {
  background: var(--ink) !important;
  color: var(--paper) !important;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 90;
  opacity: .025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E");
}

.bg-white, header.bg-white { background: rgba(10,10,11,.96) !important; }
.bg-gray-50, .hover\:bg-gray-50:hover { background: #151518 !important; }
.bg-gray-100, .bg-gray-200 { background: #242429 !important; }
.text-black { color: var(--paper) !important; }
.text-gray-400 { color: #85858b !important; }
.text-gray-500, .text-gray-600, .text-gray-700 { color: var(--muted) !important; }
.border-black { border-color: var(--paper) !important; }
.border-gray-100, .border-gray-200, .border-gray-300, .divide-y > :not([hidden]) ~ :not([hidden]) {
  border-color: var(--line) !important;
}
.nav-active { background: var(--acid) !important; color: #09090a !important; }
.album-card { border-color: var(--line) !important; background: var(--ink-soft); }
.album-card:hover { border-color: var(--acid) !important; box-shadow: 0 12px 34px rgba(0,0,0,.28) !important; }

header { border-color: var(--line) !important; backdrop-filter: blur(18px); }

main > section:first-child {

}

  background: var(--blue) !important;
  color: #09090a !important;
}

.freshness-module {

  margin: 0 auto;
  padding: 2rem 1rem 0;
}
.freshness-grid {

}

.metric-strip { display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: thin; padding: .15rem .05rem .85rem; margin-bottom: .75rem; }
.metric-chip { position: relative; display: inline-flex; align-items: center; gap: .42rem; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px; padding: .45rem .62rem; color: #d6d4ce; font-size: .68rem; }

.yearly-streams-head { display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; padding-bottom:1.25rem; border-bottom:2px solid var(--uk-black); }

.year-chip { flex:0 0 auto; min-width:4.5rem; border:1px solid #4a4a50; background:#0a0a0b; color:#f3f0e8!important; padding:.65rem .8rem; font-size:.72rem; font-weight:800; letter-spacing:.06em; cursor:pointer; scroll-snap-align:center; }

.build-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 2rem; background: var(--line); border: 1px solid var(--line); }
